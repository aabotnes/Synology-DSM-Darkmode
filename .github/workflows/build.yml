name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: tools/test.sh

      - name: Build
        id: build
        run: |
          VERSION=$(cat VERSION)
          case "$GITHUB_REF" in refs/tags/v*) VERSION=${GITHUB_REF#refs/tags/v} ;; esac
          echo "spk=$(tools/build.sh "$VERSION")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: DarkMode-spk
          path: ${{ steps.build.outputs.spk }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.spk }}" --title "Dark Mode $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
