name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: |
          python3 tools/test_gen.py
          tools/test.sh

      - name: Build
        id: build
        run: |
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          echo "spk=$(tools/build.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: DarkMode-spk
          path: ${{ steps.build.outputs.spk }}

      # Each new version in VERSION on main becomes a release with its own tag.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.build.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already released"
          else
            gh release create "$TAG" "${{ steps.build.outputs.spk }}" --target "$GITHUB_SHA" --title "Dark Mode $TAG" --notes-file RELEASE_NOTES.md
          fi
